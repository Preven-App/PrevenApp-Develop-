<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Tip - PrevenApp</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f1fc;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #6552a3;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #7461b5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #59458f;
        }

        .volver {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #6552a3;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Editar Tip</h1>
    <p>Modifica la información de tu publicación.</p>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label for="titulo">Título *</label>
        <input type="text" id="titulo" name="titulo"
               value="{{ tip.titulo }}" maxlength="100" required>

        <label for="descripcion">Descripción *</label>
        <textarea id="descripcion" name="descripcion"
                  required>{{ tip.descripcion }}</textarea>

        <label for="fuente">Fuente</label>
        <input type="text" id="fuente" name="fuente"
               value="{{ tip.fuente }}" maxlength="100">

        {% if tip.archivo %}
            <p>Archivo actual:
                <a href="{{ tip.archivo.url }}" target="_blank">
                    Ver archivo
                </a>
            </p>
        {% endif %}

        <label for="archivo">Cambiar archivo adjunto</label>
        <input type="file" id="archivo" name="archivo">

        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha"
               value="{{ tip.fecha|date:'Y-m-d' }}">

        <button type="submit">Guardar cambios</button>
    </form>

    <a class="volver" href="{% url 'lista_tips' %}">
        Volver a mis tips
    </a>

</div>

</body>
</html>
